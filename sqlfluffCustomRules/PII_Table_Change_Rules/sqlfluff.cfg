[sqlfluff]
dialect = tsql

# Custom rules are loaded but only run if they are in the active rule set.
# PI01/PI02 are the PII rules. The RG rules are the built-in cover for
# unconditional DML and destructive DDL.
rules = PI01,PI02,RG01,RG06,RG09,RG10,RG13,RG14

# large_file_skip_byte_limit is deliberately NOT set here.
#
# SQLFluff skips any file over this limit and reports zero violations for it,
# which looks identical to a clean file. Flyway's bundled SQLFluff already
# raises the low upstream default, so leave the bundled value in place.
#
# Do NOT set this to 0 in production. Zero removes the cap and parsing an
# unbounded file can take a very long time. If you need a higher ceiling, set
# a deliberate value rather than zero, and prefer splitting an oversized
# migration.
#
# The real safeguard is asserting the violation count on
# test/V001__pii_violations.sql in CI. See README section 5.

[sqlfluff:rules:pii.dml]
[sqlfluff:rules:pii.structure]
