[sqlfluff]
dialect = tsql

# Custom rules are loaded but only RUN if they're listed here. Loading a rule module and forgetting
# to add its codes to this line is the single most common way a "working" rule silently does nothing
# - there's no error, it just never fires. If you add a new rule module (see README.md in this
# folder for the how-to), its codes go on this line too.
#
# PI01/PI02 are the PII rules (rules/pii.py). The RG rules are Redgate's built-in library, covering
# unconditional DML and destructive DDL generically, with no per-object classification.
rules = ambiguous,convention,structure,RG01,RG02,RG03,RG04,RG06,RG07,RG08,RG09,PI01,PI02

# large_file_skip_byte_limit is deliberately NOT set here.
#
# SQLFluff skips any file over this limit and reports zero violations for it, which looks IDENTICAL
# to a clean file in a build log - no warning survives into `flyway check -code`'s summary the way it
# does in standalone SQLFluff. Flyway's bundled SQLFluff already raises the low upstream default, so
# leave the bundled value in place rather than guessing a number.
#
# Do NOT set this to 0 in production. Zero removes the cap entirely, and parsing an unbounded file can
# take a very long time. If a genuine migration needs a higher ceiling, set a deliberate value rather
# than zero - and consider splitting an oversized migration instead, since a partial failure mid-way
# through a very large migration is already harder to reason about than one split across two smaller
# migrations.
#
# The real safeguard against this failure mode isn't a config setting at all - it's asserting the
# violation count against tests/pii/V001__pii_violations.sql in CI. A skipped file and a genuinely
# clean file both report zero violations; only a count assertion against a KNOWN-bad file tells them
# apart. See the root README.md, section 6, and code-review-rules/README.md.

# One [sqlfluff:rules:<name>] section per rule `name` attribute (not per rule CODE) is required for
# SQLFluff to recognise the rule exists at all, even with no options set underneath it. Add one here
# for every new rule module's rule(s).
[sqlfluff:rules:pii.dml]
[sqlfluff:rules:pii.structure]
